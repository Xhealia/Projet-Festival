# CI : lancée à chaque push sur main.
# Elle vérifie que le code est correct avant tout déploiement.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Teste le serveur Express (la modération est simulée, pas d'appel réel à l'API)
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
# Vérifie la qualité du code du front (lint) et vérifie qu'il compile
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      
# Vérifie que les deux images Docker se construisent
  docker:
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./server
      - run: docker build ./client