# CD : déploie automatiquement sur le serveur quand la CI réussit sur main.
# Se connecte en SSH, met à jour le code, relance docker compose.
# Secrets GitHub nécessaires : SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Projet-Festival
            git pull origin main
            docker compose up -d --build
            docker image prune -f